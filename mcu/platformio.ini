[platformio]
src_dir = src

[env:esp32-c3-oled]
platform = espressif32 @ ~6.6.0
board = esp32-c3-devkitm-1
framework = espidf

board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB

lib_deps =
    olikraus/U8g2@^2.35.9

upload_speed = 921600
monitor_speed = 115200
